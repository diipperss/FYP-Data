by_level:
  beginner: |-
    ```yaml
    questions:
      - type: fill_blank_mcq
        question: When you need money quickly, like for an emergency, you should use your ___ account.
        options: [A. Checking, B. Savings, C. Investment, D. Retirement]
        answer: B
      - type: drag_drop
        question: Match the financial goal to the best tool.
        drag_drop:
          prompt: Drag the goal to the best tool.
          pairs:
            - left: Buying a house in 3 years
              right: Savings account
            - left: Retirement in 30 years
              right: Investment account
            - left: Emergency fund
              right: Savings account
        answer: Buying a house in 3 years: Savings account, Retirement in 30 years: Investment account, Emergency fund: Savings account
      - type: case_study_mcq
        scenario: Maria wants to buy a new car in six months. She has some money saved, but not enough. She’s considering selling some of her investments to cover the rest.
        question: What is the best advice for Maria?
        options: [A. Invest more money to earn more quickly, B. Use her savings account, C. Keep her investments and save more each month, D. Borrow money from a friend]
        answer: B
      - type: true_false
        question: Investing is generally better for short-term goals than saving.
        answer: false
    ```
  intermediate: |-
    ```yaml
    questions:
      - type: fill_blank_mcq
        question: Although savings accounts are safe, they often struggle to _____ inflation, diminishing the purchasing power of your money.
        answer: A
        options: [A. outpace, B. match, C. ignore, D. equal]
      - type: drag_drop
        question: Match the financial goal to the most appropriate investment strategy.
        drag_drop:
          prompt: Drag the goals to the best matching strategy.
          pairs:
            - left: Retirement in 30 years
              right: Growth-focused investments
            - left: Down payment on a house in 2 years
              right: High-yield savings account
            - left: Emergency fund for 6 months of expenses
              right: Money market fund
        answer: Retirement in 30 years - Growth-focused investments, Down payment on a house in 2 years - High-yield savings account, Emergency fund for 6 months of expenses - Money market fund
      - type: case_study_mcq
        scenario: Maria is 25 and wants to buy a house in 5 years. She currently has $5,000 saved and plans to save $500 per month. She's considering putting her savings in a high-yield savings account earning 2% annually or investing in a stock market index fund with an expected average return of 7% annually. Given her goal, what is the most prudent course of action?
        question: What should Maria do?
        answer: B
        options: [A. Invest everything in the stock market for maximum returns, B. Primarily use the high-yield savings account to ensure safety and accessibility, C. Split her savings evenly between the two options, D. Withdraw her savings and wait to buy a house until she has enough cash.]
      - type: true_false
        question: Compound growth allows investments to generate earnings not only on the initial investment but also on the accumulated interest or dividends.
        answer: true
    ```
  advanced: |-
    ```yaml
    questions:
      - type: fill_blank_mcq
        question: A key advantage of a goal-based bucket system is that it helps avoid ___ during periods of market volatility.
        options: [A. excessive diversification, B. emotional selling, C. unnecessary tax implications, D. premature reinvestment]
        answer: B
      - type: drag_drop
        question: Match the financial goal with the most appropriate asset allocation strategy.
        drag_drop:
          prompt: Drag the goals to the appropriate allocation strategy.
          pairs:
            - left: Down payment on a house in 2 years
              right: Short-term bonds or high-yield savings account
            - left: Retirement in 30 years
              right: Stocks and diversified ETFs
            - left: Emergency fund for 3 months' expenses
              right: Cash or money market fund
        answer: Down payment on a house in 2 years - Short-term bonds or high-yield savings account, Retirement in 30 years - Stocks and diversified ETFs, Emergency fund for 3 months' expenses - Cash or money market fund
      - type: case_study_mcq
        scenario: Eleanor is 45 and wants to retire at 65. She has $100,000 in a retirement account and $5,000 in a savings account. She also has a goal to buy a new car in 5 years, costing $30,000.  Given her goals and timeline, what would be the MOST appropriate initial allocation strategy?
        question: What would be the MOST appropriate initial allocation strategy?
        options: [A. Allocate 80% to stocks, 20% to bonds, and maintain her current savings, B. Allocate 50% to stocks, 50% to bonds, and invest an additional $5,000, C. Allocate $20,000 to a short-term savings account for the car, invest the remaining $80,000 in a diversified portfolio, and keep her existing savings, D. Keep all funds in high-yield savings accounts to ensure safety and liquidity.]
        answer: C
      - type: true_false
        question: Diversification guarantees the elimination of all investment risk.
        answer: false
    ```
